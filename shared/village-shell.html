<nav id="village-dock" aria-label="마을 이동과 설정" hidden>
 <button id="village-spaces" type="button" aria-label="공간 이동" data-shell-panel="spaces"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14m-4-4 4 4-4 4M19 17H5m4-4-4 4 4 4"/></svg>공간 이동</button>
 <button id="village-more" type="button" aria-label="더보기" data-shell-panel="more"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg>더보기</button>
</nav>
<aside id="village-recovery" hidden>
 <span id="village-recovery-text" role="status"></span>
 <button id="village-retry" type="button">다시 연결</button>
</aside>
<dialog id="village-menu" aria-labelledby="village-menu-title">
 <header><h2 id="village-menu-title"></h2><button id="village-menu-close" type="button" aria-label="닫기">×</button></header>
 <section id="village-menu-spaces" class="village-menu-page" hidden><div id="village-current-space"></div><div id="village-travel-slot"></div></section>
 <section id="village-menu-more" class="village-menu-page" hidden>
  <button type="button" data-shell-panel="records">내 기록</button>
  <button type="button" data-shell-panel="profile">캐릭터·닉네임</button>
  <button type="button" data-shell-action="sound">소리 <small id="village-sound-state">꺼짐</small></button>
  <button type="button" data-shell-action="help">놀이 방법</button>
 </section>
 <section id="village-menu-records" class="village-menu-page" hidden>
  <button type="button" data-shell-action="book">생물 도감</button>
  <button type="button" data-shell-action="journal">마을 일기</button>
  <button type="button" data-shell-action="bag">가방</button>
  <button type="button" class="village-plain" data-shell-panel="more"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg>더보기로</button>
 </section>
 <form id="village-menu-profile" class="village-menu-page" hidden>
  <div id="village-characters" aria-label="캐릭터 선택">
   <button type="button" data-profile-character="0">토끼</button>
   <button type="button" data-profile-character="1">곰</button>
   <button type="button" data-profile-character="2">여우</button>
  </div>
  <label for="village-profile-name">닉네임</label>
  <input id="village-profile-name" maxlength="12" autocomplete="nickname">
  <button class="enter" type="submit">저장</button>
 </form>
</dialog>
